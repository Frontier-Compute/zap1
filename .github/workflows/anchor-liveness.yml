name: anchor-liveness

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  prove-liveness:
    runs-on: ubuntu-latest
    env:
      ZAP1_API_BASE: https://api.frontiercompute.cash
      ZAP1_MAX_ANCHOR_AGE_HOURS: "72"
      ZAP1_EXPECTED_DEPLOYMENT_IMAGE_ID: ${{ vars.ZAP1_EXPECTED_DEPLOYMENT_IMAGE_ID }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify deployed source, anchor, and current proof
        env:
          ZAP1_ADMIN_API_KEY: ${{ secrets.ZAP1_ADMIN_API_KEY }}
        run: bash scripts/check_live.sh
