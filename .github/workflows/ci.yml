name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -W clippy::all

      - name: Run all tests
        run: cargo test --workspace --all-targets --locked

      - name: Run integration tests
        run: cargo test --locked --test memo_merkle_test

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit proof bundle
        run: cargo run --quiet --locked --bin zap1_audit -- --bundle examples/live_ownership_attest_proof.json

      - name: Schema validator
        run: cargo run --quiet --locked --bin zap1_schema -- --witness examples/schema_witness.json

      - name: Schema validator JSON output
        run: cargo run --quiet --locked --bin zap1_schema -- --witness examples/schema_witness.json --json

      - name: ZIP 302 TVLV roundtrip
        run: |
          memo_hex=$(cargo run --quiet --locked --bin zip302_tvlv -- encode examples/zip302_parts_example.json | tail -n 1)
          cargo run --quiet --locked --bin zip302_tvlv -- decode "$memo_hex"

      - name: Operator status (green fixture)
        run: cargo run --quiet --locked --bin zap1_ops -- --from-dir examples/zap1_ops_fixture --json

      - name: Operator status (must fail on critical fixture)
        run: |
          if cargo run --quiet --locked --bin zap1_ops -- --from-dir examples/zap1_ops_fixture_critical --json; then
            echo "expected failure on critical fixture"
            exit 1
          fi

      - name: Operator status unit tests
        run: cargo test --quiet --locked --bin zap1_ops

      - name: Liveness script compiles
        run: python3 -m py_compile scripts/check_anchor_liveness.py

      - name: Liveness policy tests
        run: python3 -m unittest scripts/check_anchor_liveness_test.py

      - name: Operational control contracts
        run: python3 scripts/check_operational_controls.py

      - name: Required admin check rejects a missing key
        run: |
          if ZAP1_REQUIRE_AUTHENTICATED_ADMIN_CHECKS=true python3 conformance/check_api.py --self-test; then
            echo "expected required admin policy to reject a missing key"
            exit 1
          fi

      - name: Required admin check rejects an unsafe key and accepts a safe key
        run: |
          if ZAP1_REQUIRE_AUTHENTICATED_ADMIN_CHECKS=true ZAP1_ADMIN_API_KEY='bad key' python3 conformance/check_api.py --self-test; then
            echo "expected required admin policy to reject an unsafe key"
            exit 1
          fi
          ZAP1_REQUIRE_AUTHENTICATED_ADMIN_CHECKS=true ZAP1_ADMIN_API_KEY='safe_key-1' python3 conformance/check_api.py --self-test

      - name: Conformance protocol checks
        run: python3 conformance/check.py

      - name: Compatibility vectors
        run: python3 scripts/check_compatibility.py

      - name: Verify export package offline
        run: cargo run --quiet --locked --bin zap1_audit -- --export conformance/valid_export.json

      - name: Reject invalid bundle
        run: |
          if cargo run --quiet --locked --bin zap1_audit -- --bundle conformance/invalid_bundle.json 2>/dev/null; then
            echo "expected failure on invalid bundle"
            exit 1
          fi

  evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler
      - name: Run deterministic local evaluator
        run: bash scripts/check_local.sh
